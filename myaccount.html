<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHRI Workforce - My Account</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    h1, h2 {
      margin-top: 0;
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand h1 {
      margin-bottom: 5px;
    }

    .brand p {
      color: #666;
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .logout {
      background: #b91c1c;
      margin-top: 10px;
    }

    .hidden {
      display: none;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
    }

    .success {
      background: #dcfce7;
      color: #166534;
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .label {
      color: #666;
    }

    .value {
      font-weight: bold;
      text-align: right;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .dashboard-item {
      background: #f8fafc;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      border: 1px solid #e5e7eb;
    }

    .dashboard-item strong {
      display: block;
      font-size: 24px;
      margin-bottom: 5px;
    }

    .small {
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="brand">
    <h1>SHRI Workforce</h1>
    <p>Workforce Management System</p>
  </div>

  <!-- LOGIN -->
  <div id="loginSection" class="card">

    <h2>Login</h2>

    <label>Email</label>
    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      autocomplete="email"
    >

    <label>Password</label>
    <input
      type="password"
      id="password"
      placeholder="Enter your password"
      autocomplete="current-password"
    >

    <button id="loginButton">Login</button>

    <div id="loginMessage"></div>

  </div>


  <!-- ACCOUNT -->
  <div id="accountSection" class="hidden">

    <div class="card">

      <h2>My Account</h2>

      <div id="profileDetails"></div>

      <button class="logout" id="logoutButton">
        Logout
      </button>

    </div>


    <div class="card">

      <h2>Dashboard</h2>

      <div class="dashboard-grid">

        <div class="dashboard-item">
          <strong id="shiftCount">0</strong>
          <span class="small">Shifts</span>
        </div>

        <div class="dashboard-item">
          <strong id="advanceCount">0</strong>
          <span class="small">Advances</span>
        </div>

        <div class="dashboard-item">
          <strong id="paymentCount">0</strong>
          <span class="small">Payments</span>
        </div>

        <div class="dashboard-item">
          <strong id="reviewCount">0</strong>
          <span class="small">Reviews</span>
        </div>

      </div>

    </div>


    <div id="statusMessage"></div>

  </div>

</div>


<script>

  // ==========================================
  // SUPABASE CONNECTION
  // ==========================================

  const SUPABASE_URL =
    "https://czokudhdlgttvlisuher.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_Ozw2zF75g3lhQX8FBkfVJg_IggHsuWP";

  const { createClient } =
    supabase;

  const db = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


  // ==========================================
  // ELEMENTS
  // ==========================================

  const loginSection =
    document.getElementById("loginSection");

  const accountSection =
    document.getElementById("accountSection");

  const loginButton =
    document.getElementById("loginButton");

  const logoutButton =
    document.getElementById("logoutButton");

  const loginMessage =
    document.getElementById("loginMessage");

  const statusMessage =
    document.getElementById("statusMessage");

  const profileDetails =
    document.getElementById("profileDetails");


  // ==========================================
  // LOGIN
  // ==========================================

  loginButton.addEventListener("click", async () => {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    loginMessage.innerHTML = "";

    if (!email || !password) {

      loginMessage.innerHTML =
        '<div class="error">Please enter your email and password.</div>';

      return;
    }

    loginButton.disabled = true;
    loginButton.textContent = "Logging in...";

    const { error } =
      await db.auth.signInWithPassword({
        email: email,
        password: password
      });

    loginButton.disabled = false;
    loginButton.textContent = "Login";

    if (error) {

      loginMessage.innerHTML =
        `<div class="error">${escapeHtml(error.message)}</div>`;

      return;
    }

    loginMessage.innerHTML =
      '<div class="success">Login successful.</div>';

    await loadAccount();

  });


  // ==========================================
  // LOAD ACCOUNT
  // ==========================================

  async function loadAccount() {

    const {
      data: { user }
    } = await db.auth.getUser();

    if (!user) {

      showLogin();

      return;
    }

    const {
      data: profile,
      error
    } = await db
      .from("profiles")
      .select("id, full_name, mobile, role, status")
      .eq("id", user.id)
      .single();

    if (error) {

      showError(
        "Your login works, but your profile could not be loaded."
      );

      console.error(error);

      return;
    }


    // ========================================
    // DISPLAY PROFILE
    // ========================================

    profileDetails.innerHTML = `

      <div class="info-row">
        <span class="label">Name</span>
        <span class="value">
          ${escapeHtml(profile.full_name || "")}
        </span>
      </div>

      <div class="info-row">
        <span class="label">Email</span>
        <span class="value">
          ${escapeHtml(user.email || "")}
        </span>
      </div>

      <div class="info-row">
        <span class="label">Role</span>
        <span class="value">
          ${escapeHtml(profile.role || "")}
        </span>
      </div>

      <div class="info-row">
        <span class="label">Status</span>
        <span class="value">
          ${escapeHtml(profile.status || "")}
        </span>
      </div>

    `;


    // ========================================
    // LOAD DASHBOARD COUNTS
    // ========================================

    await loadDashboard(profile);


    loginSection.classList.add("hidden");
    accountSection.classList.remove("hidden");

  }


  // ==========================================
  // DASHBOARD
  // ==========================================

  async function loadDashboard(profile) {

    let shiftQuery =
      db.from("shifts")
        .select("*", { count: "exact", head: true });

    let advanceQuery =
      db.from("advances")
        .select("*", { count: "exact", head: true });

    let paymentQuery =
      db.from("payments")
        .select("*", { count: "exact", head: true });

    let reviewQuery =
      db.from("reviews")
        .select("*", { count: "exact", head: true });


    // ----------------------------------------
    // EMPLOYEE
    // ----------------------------------------

    if (profile.role === "employee") {

      const { data: employee } =
        await db
          .from("employees")
          .select("id")
          .eq("profile_id", profile.id)
          .single();

      if (employee) {

        shiftQuery =
          shiftQuery.eq("employee_id", employee.id);

        advanceQuery =
          advanceQuery.eq("employee_id", employee.id);

        paymentQuery =
          paymentQuery.eq("employee_id", employee.id);

      } else {

        shiftQuery = null;
        advanceQuery = null;
        paymentQuery = null;

      }

      reviewQuery = null;
    }


    // ----------------------------------------
    // SUPERVISOR
    // ----------------------------------------

    else if (profile.role === "supervisor") {

      const { data: supervisor } =
        await db
          .from("supervisors")
          .select("id")
          .eq("profile_id", profile.id)
          .single();

      if (supervisor) {

        shiftQuery =
          shiftQuery.eq(
            "supervisor_id",
            supervisor.id
          );

        advanceQuery =
          advanceQuery.eq(
            "sender_supervisor_id",
            supervisor.id
          );

      } else {

        shiftQuery = null;
        advanceQuery = null;

      }

      paymentQuery = null;
    }


    // ----------------------------------------
    // CLIENT
    // ----------------------------------------

    else if (profile.role === "client") {

      const { data: client } =
        await db
          .from("clients")
          .select("id")
          .eq("profile_id", profile.id)
          .single();

      if (client) {

        shiftQuery =
          shiftQuery.eq(
            "client_id",
            client.id
          );

      } else {

        shiftQuery = null;

      }

      advanceQuery = null;
      paymentQuery = null;
      reviewQuery = null;
    }


    // ----------------------------------------
    // ADMIN
    // ----------------------------------------

    // Admin intentionally keeps all queries.
    // RLS determines what can actually be returned.


    const results = await Promise.all([

      shiftQuery
        ? shiftQuery
        : Promise.resolve({ count: 0 }),

      advanceQuery
        ? advanceQuery
        : Promise.resolve({ count: 0 }),

      paymentQuery
        ? paymentQuery
        : Promise.resolve({ count: 0 }),

      reviewQuery
        ? reviewQuery
        : Promise.resolve({ count: 0 })

    ]);


    document.getElementById("shiftCount").textContent =
      results[0].count ?? 0;

    document.getElementById("advanceCount").textContent =
      results[1].count ?? 0;

    document.getElementById("paymentCount").textContent =
      results[2].count ?? 0;

    document.getElementById("reviewCount").textContent =
      results[3].count ?? 0;


    showStatus(
      "Database connection successful."
    );

  }


  // ==========================================
  // LOGOUT
  // ==========================================

  logoutButton.addEventListener("click", async () => {

    await db.auth.signOut();

    showLogin();

  });


  // ==========================================
  // AUTH STATE
  // ==========================================

  db.auth.onAuthStateChange(
    async (event, session) => {

      if (session) {

        await loadAccount();

      } else {

        showLogin();

      }

    }
  );


  // ==========================================
  // CHECK EXISTING SESSION
  // ==========================================

  async function checkExistingSession() {

    const {
      data: { session }
    } = await db.auth.getSession();

    if (session) {

      await loadAccount();

    } else {

      showLogin();

    }

  }


  // ==========================================
  // UI HELPERS
  // ==========================================

  function showLogin() {

    loginSection.classList.remove("hidden");
    accountSection.classList.add("hidden");

  }


  function showStatus(message) {

    statusMessage.innerHTML =
      `<div class="success">${escapeHtml(message)}</div>`;

  }


  function showError(message) {

    statusMessage.innerHTML =
      `<div class="error">${escapeHtml(message)}</div>`;

  }


  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  // Start application
  checkExistingSession();

</script>

</body>
</html>
