<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHRI Workforce - My Account</title>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand h1 {
      margin-bottom: 5px;
    }

    .brand p {
      color: #666;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      margin: 7px 0 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 11px 16px;
      border: 0;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .logout {
      background: #b91c1c;
      margin-top: 15px;
    }

    .edit {
      background: #2563eb;
    }

    .delete {
      background: #b91c1c;
    }

    .cancel {
      background: #6b7280;
      margin-left: 8px;
    }

    .hidden {
      display: none;
    }

    .success {
      background: #dcfce7;
      color: #166534;
      padding: 12px;
      border-radius: 8px;
      margin: 15px 0;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 12px;
      border-radius: 8px;
      margin: 15px 0;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .label {
      color: #666;
    }

    .value {
      font-weight: bold;
      text-align: right;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    .dashboard-item {
      background: #f8fafc;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      border: 1px solid #e5e7eb;
    }

    .dashboard-item strong {
      display: block;
      font-size: 24px;
      margin-bottom: 5px;
    }

    .small {
      color: #666;
      font-size: 14px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .form-grid .full {
      grid-column: 1 / -1;
    }

    .table-wrapper {
      overflow-x: auto;
      margin-top: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
    }

    th {
      background: #f8fafc;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #666;
    }

    @media (max-width: 700px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-grid .full {
        grid-column: auto;
      }

      .info-row {
        flex-direction: column;
        gap: 4px;
      }

      .value {
        text-align: left;
      }
    }
  </style></head><body><div class="container">  <div class="brand">
    <h1>SHRI Workforce</h1>
    <p>Workforce Management System</p>
  </div>  <!-- LOGIN -->  <div id="loginSection" class="card"><h2>Login</h2>

<label>Email</label>

<input
  type="email"
  id="email"
  placeholder="Enter your email"
  autocomplete="email"
>

<label>Password</label>

<input
  type="password"
  id="password"
  placeholder="Enter your password"
  autocomplete="current-password"
>

<button id="loginButton">
  Login
</button>

<div id="loginMessage"></div>

  </div>  <!-- ACCOUNT -->  <div id="accountSection" class="hidden"><!-- PROFILE -->

<div class="card">

  <h2>My Account</h2>

  <div id="profileDetails"></div>

  <button class="logout" id="logoutButton">
    Logout
  </button>

</div>


<!-- DASHBOARD -->

<div class="card">

  <h2>Dashboard</h2>

  <div class="dashboard-grid">

    <div class="dashboard-item">
      <strong id="shiftCount">0</strong>
      <span class="small">Shifts</span>
    </div>

    <div class="dashboard-item">
      <strong id="advanceCount">0</strong>

    <div class="dashboard-item">

      <span class="small">Payments</span>
    </div>

    <div class="dashboard-item">
      <strong id="reviewCount">0</strong>
      <span class="small">Reviews</span>
    </div>

  </div>

</div>


<!-- EMPLOYEE MANAGEMENT -->

<div id="employeeSection" class="card hidden">

  <h2>Employees</h2>

  <p class="small">
    Add, edit and manage workforce employees.
  </p>


  <form id="employeeForm">

    <input
      type="hidden"
      id="employeeId"
    >

    <div class="form-grid">

      <div>
        <label>Employee Code</label>

        <input
          type="text"
          id="employeeCode"
          placeholder="EMP002"
          required
        >
      </div>


      <div>
        <label>Full Name</label>

          type="text"
          id="employeeName"
          placeholder="Employee name"
          required
        >
      </div>


      <div>
        <label>Mobile</label>

        <input
          type="tel"
          id="employeeMobile"
          placeholder="Mobile number"
        >
      </div>

<div>
  <label>Supervisor</label>

  <select id="employeeSupervisor">
    <option value="">

  </select>
</div>
      <div>

          <th>Mobile</th>

          <th>Actions</th>
        </tr>

      <tbody id="employeeTableBody"></tbody>

    </table>

  </div>

</div>


<!-- SUPERVISOR MANAGEMENT -->

<div id="supervisorSection" class="card hidden">

  <h2>Supervisors</h2>

  <p class="small">
    Add, edit and manage workforce supervisors.
  </p>


  <!-- SUPERVISOR FORM -->

  <form id="supervisorForm">

    <input
      type="hidden"
      id="supervisorId"
    >

    <div class="form-grid">

      <div>
        <label>Supervisor Code</label>

        <input
          type="text"
          id="supervisorCode"

          required

      </div>


      <div>
        <label>Full Name</label>

        <input
          type="text"
          id="supervisorName"
          placeholder="Supervisor name"

      </div>


      <div>

          type="tel"

  <!-- SUPERVISOR LIST -->

  <div class="table-wrapper">

    <table>

      <thead>

        <tr>
          <th>Code</th>
          <th>Name</th>
          <th>Mobile</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>

      </thead>

      <tbody id="supervisorTableBody"></tbody>

    </table>

  </div>

</div>


<div id="statusMessage"></div>

  </div></div><script>

  // ==========================================
  // SUPABASE
  // ==========================================

  const SUPABASE_URL =
    "https://czokudhdlgttvlisuher.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_Ozw2zF75g3lhQX8FBkfVJg_IggHsuWP";

  const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


  // ==========================================
  // ELEMENTS
  // ==========================================

  const loginSection =
    document.getElementById("loginSection");

  const accountSection =
    document.getElementById("accountSection");

  const loginButton =
    document.getElementById("loginButton");

  const logoutButton =
    document.getElementById("logoutButton");

  const loginMessage =
    document.getElementById("loginMessage");

  const statusMessage =
    document.getElementById("statusMessage");

  const profileDetails =
    document.getElementById("profileDetails");

  const employeeSection =
    document.getElementById("employeeSection");

  const supervisorSection =
    document.getElementById("supervisorSection");

  const employeeForm =
    document.getElementById("employeeForm");

  const supervisorForm =
    document.getElementById("supervisorForm");

  const employeeMessage =
    document.getElementById("employeeMessage");

  const supervisorMessage =
    document.getElementById("supervisorMessage");

  const employeeTableBody =
    document.getElementById("employeeTableBody");

  const supervisorTableBody =
    document.getElementById("supervisorTableBody");

  const cancelEditButton =
    document.getElementById("cancelEditButton");

  const cancelSupervisorEditButton =
    document.getElementById(
      "cancelSupervisorEditButton"
    );


  // ==========================================
  // LOGIN
  // ==========================================

  loginButton.addEventListener("click", async () => {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    loginMessage.innerHTML = "";

    if (!email || !password) {

      loginMessage.innerHTML =
        '<div class="error">Please enter your email and password.</div>';

      return;
    }

    loginButton.disabled = true;
    loginButton.textContent = "Logging in...";

    const { error } =
      await db.auth.signInWithPassword({
        email,
        password
      });

    loginButton.disabled = false;
    loginButton.textContent = "Login";

    if (error) {

      loginMessage.innerHTML =
        `<div class="error">${escapeHtml(error.message)}</div>`;

      return;
    }

    await loadAccount();

  });


  // ==========================================
  // LOAD ACCOUNT
  // ==========================================

  async function loadAccount() {

    const {
      data: { user }
    } = await db.auth.getUser();

    if (!user) {

      showLogin();

      return;
    }


    const {
      data: profile,
      error
    } = await db
      .from("profiles")
      .select("id, full_name, mobile, role, status")
      .eq("id", user.id)
      .single();


    if (error) {

      showError(
        "Your login works, but your profile could not be loaded."
      );

      console.error(error);

      return;
    }


    profileDetails.innerHTML = `

      <div class="info-row">
        <span class="label">Name</span>
        <span class="value">
          ${escapeHtml(profile.full_name || "")}
        </span>
      </div>

      <div class="info-row">
        <span class="label">Email</span>
        <span class="value">
          ${escapeHtml(user.email || "")}
        </span>
      </div>

      <div class="info-row">
        <span class="label">Role</span>
        <span class="value">
          ${escapeHtml(profile.role || "")}
        </span>
      </div>

      <div class="info-row">
        <span class="label">Status</span>
        <span class="value">
          ${escapeHtml(profile.status || "")}
        </span>
      </div>

    `;


    await loadDashboard(profile);


    if (profile.role === "admin") {

      employeeSection.classList.remove("hidden");

      supervisorSection.classList.remove("hidden");

      await loadSupervisors();

await loadSupervisorOptions();

await loadEmployees();

    } else {

      employeeSection.classList.add("hidden");

      supervisorSection.classList.add("hidden");

    }


    loginSection.classList.add("hidden");
    accountSection.classList.remove("hidden");

  }


  // ==========================================
  // DASHBOARD
  // ==========================================

  async function loadDashboard(profile) {

    let shiftQuery =
      db.from("shifts")
        .select("*", {
          count: "exact",
          head: true
        });

    let advanceQuery =
      db.from("advances")
        .select("*", {
          count: "exact",
          head: true
        });

    let paymentQuery =
      db.from("payments")
        .select("*", {
          count: "exact",
          head: true
        });

    let reviewQuery =
      db.from("reviews")
        .select("*", {
          count: "exact",
          head: true
        });


    if (profile.role === "employee") {

      const { data: employee } =
        await db
          .from("employees")
          .select("id")
          .eq("profile_id", profile.id)
          .single();

      if (employee) {

        shiftQuery =
          shiftQuery.eq("employee_id", employee.id);

        advanceQuery =
          advanceQuery.eq("employee_id", employee.id);

        paymentQuery =
          paymentQuery.eq("employee_id", employee.id);

      } else {

        shiftQuery = null;
        advanceQuery = null;
        paymentQuery = null;

      }

      reviewQuery = null;

    }


    else if (profile.role === "supervisor") {

      const { data: supervisor } =
        await db
          .from("supervisors")
          .select("id")
          .eq("profile_id", profile.id)
          .single();

      if (supervisor) {

        shiftQuery =
          shiftQuery.eq(
            "supervisor_id",
            supervisor.id
          );

        advanceQuery =
          advanceQuery.eq(
            "sender_supervisor_id",
            supervisor.id
          );

      } else {

        shiftQuery = null;
        advanceQuery = null;

      }

      paymentQuery = null;

    }


    else if (profile.role === "client") {

      const { data: client } =
        await db
          .from("clients")
          .select("id")
          .eq("profile_id", profile.id)
          .single();

      if (client) {

        shiftQuery =
          shiftQuery.eq(
            "client_id",
            client.id
          );

      } else {

        shiftQuery = null;

      }

      advanceQuery = null;
      paymentQuery = null;
      reviewQuery = null;

    }


    const results = await Promise.all([

      shiftQuery
        ? shiftQuery
        : Promise.resolve({ count: 0 }),

      advanceQuery
        ? advanceQuery
        : Promise.resolve({ count: 0 }),

      paymentQuery
        ? paymentQuery
        : Promise.resolve({ count: 0 }),

      reviewQuery
        ? reviewQuery
        : Promise.resolve({ count: 0 })

    ]);


    document.getElementById("shiftCount").textContent =
      results[0].count ?? 0;

    document.getElementById("advanceCount").textContent =
      results[1].count ?? 0;

    document.getElementById("paymentCount").textContent =
      results[2].count ?? 0;

    document.getElementById("reviewCount").textContent =
      results[3].count ?? 0;


    showStatus(
      "Database connection successful."
    );

  }


  // ==========================================
  // LOAD EMPLOYEES
  // ==========================================
// ==========================================
// LOAD SUPERVISOR OPTIONS
// ==========================================

async function loadSupervisorOptions() {

  const supervisorSelect =
    document.getElementById("employeeSupervisor");

  supervisorSelect.innerHTML =
    `<option value="">No Supervisor</option>`;

  const {
    data,
    error
  } = await db
    .from("supervisors")
    .select("id, supervisor_code, full_name")
    .eq("status", "active")
    .order("full_name", {
      ascending: true
    });

  if (error) {

    console.error(
      "Could not load supervisors:",
      error
    );

    return;
  }

  if (!data) {
    return;
  }

  data.forEach(supervisor => {

    const option =
      document.createElement("option");

    option.value =
      supervisor.id;

    option.textContent =
      `${supervisor.full_name} (${supervisor.supervisor_code})`;

    supervisorSelect.appendChild(option);

  });

}
  async function loadEmployees() {

    employeeTableBody.innerHTML =
      `<tr>
        <td colspan="5" class="empty">
          Loading employees...
        </td>
      </tr>`;


    const {
      data,
      error
    } = await db
      .from("employees")
      .select(
        "id, employee_code, full_name, mobile, status"
      )
      .order("id", {
        ascending: true
      });


    if (error) {

      employeeTableBody.innerHTML =
        `<tr>
          <td colspan="5" class="empty">
            Could not load employees.
          </td>
        </tr>`;

      console.error(error);

      return;
    }


    if (!data || data.length === 0) {

      employeeTableBody.innerHTML =
        `<tr>
          <td colspan="5" class="empty">
            No employees found.
          </td>
        </tr>`;

      return;
    }


    employeeTableBody.innerHTML =
      data.map(employee => `

        <tr>

          <td>
            ${escapeHtml(employee.employee_code || "")}
          </td>

          <td>
            ${escapeHtml(employee.full_name || "")}
          </td>

          <td>
            ${escapeHtml(employee.mobile || "")}
          </td>

          <td>
            ${escapeHtml(employee.status || "")}
          </td>

          <td>

            <div class="actions">

              <button
                class="edit"
                onclick="editEmployee(${employee.id})"
              >
                Edit
              </button>

              <button
                class="delete"
                onclick="deleteEmployee(${employee.id}, '${escapeJs(employee.full_name)}')"
              >
                Delete
              </button>

            </div>

          </td>

        </tr>

      `).join("");

  }


  // ==========================================
  // ADD / EDIT EMPLOYEE
  // ==========================================

  employeeForm.addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();


      const id =
        document.getElementById("employeeId").value;

      const employeeCode =
        document.getElementById("employeeCode").value.trim();

      const fullName =
        document.getElementById("employeeName").value.trim();

      const mobile =
  document.getElementById("employeeMobile").value.trim();

const supervisorId =
  document.getElementById("employeeSupervisor").value;

const status =
  document.getElementById("employeeStatus").value;


      if (!employeeCode || !fullName) {

        showEmployeeError(
          "Employee code and name are required."
        );

        return;
      }


      const payload = {

  employee_code: employeeCode,

  full_name: fullName,

  mobile: mobile || null,

  supervisor_id:
    supervisorId
      ? Number(supervisorId)
      : null,

  status: status

};


      const saveButton =
        document.getElementById(
          "saveEmployeeButton"
        );


      saveButton.disabled = true;
      saveButton.textContent =
        id ? "Saving..." : "Adding...";


      let result;


      if (id) {

        result =
          await db
            .from("employees")
            .update(payload)
            .eq("id", id);

      } else {

        result =
          await db
            .from("employees")
            .insert(payload);

      }


      saveButton.disabled = false;


      if (result.error) {

        showEmployeeError(
          result.error.message
        );

        saveButton.textContent =
          id ? "Save Changes" : "Add Employee";

        return;
      }


      showEmployeeSuccess(
        id
          ? "Employee updated successfully."
          : "Employee added successfully."
      );


      resetEmployeeForm();

      await loadEmployees();

    }
  );


  // ==========================================
  // EDIT EMPLOYEE
  // ==========================================

  async function editEmployee(id) {

    const {
      data,
      error
    } = await db
      .from("employees")
      .select(
  "id, employee_code, full_name, mobile, supervisor_id, status"
)
      .eq("id", id)
      .single();


    if (error) {

      showEmployeeError(
        error.message
      );

      return;
    }


    document.getElementById("employeeId").value =
      data.id;

    document.getElementById("employeeCode").value =
      data.employee_code || "";

    document.getElementById("employeeName").value =
      data.full_name || "";

    document.getElementById("employeeMobile").value =
      data.mobile || "";

    document.getElementById("employeeStatus").value =
      data.status || "active";


    document.getElementById(
      "saveEmployeeButton"
    ).textContent =
      "Save Changes";


    cancelEditButton.classList.remove(
      "hidden"
    );


    window.scrollTo({
      top: employeeSection.offsetTop,
      behavior: "smooth"
    });

  }


  // ==========================================
  // DELETE EMPLOYEE
  // ==========================================

  async function deleteEmployee(
    id,
    employeeName
  ) {

    const confirmed =
      confirm(
        `Delete ${employeeName}?\n\nThis action cannot be undone.`
      );


    if (!confirmed) {
      return;
    }


    const {
      error
    } = await db
      .from("employees")
      .delete()
      .eq("id", id);


    if (error) {

      showEmployeeError(
        error.message
      );

      return;
    }


    showEmployeeSuccess(
      "Employee deleted successfully."
    );


    await loadEmployees();

  }


  // ==========================================
  // CANCEL EMPLOYEE EDIT
  // ==========================================

  cancelEditButton.addEventListener(
    "click",
    () => {

      resetEmployeeForm();

    }
  );


  // ==========================================
  // RESET EMPLOYEE FORM
  // ==========================================

  function resetEmployeeForm() {

    employeeForm.reset();

    document.getElementById(
      "employeeId"
    ).value = "";

    document.getElementById(
      "employeeStatus"
    ).value = "active";

    document.getElementById(
      "saveEmployeeButton"
    ).textContent =
      "Add Employee";

    cancelEditButton.classList.add(
      "hidden"
    );

  }


  // ==========================================
  // LOAD SUPERVISORS
  // ==========================================

  async function loadSupervisors() {

    supervisorTableBody.innerHTML =
      `<tr>
        <td colspan="5" class="empty">
          Loading supervisors...
        </td>
      </tr>`;


    const {
      data,
      error
    } = await db
      .from("supervisors")
      .select(
        "id, supervisor_code, full_name, mobile, status"
      )
      .order("id", {
        ascending: true
      });


    if (error) {

      supervisorTableBody.innerHTML =
        `<tr>
          <td colspan="5" class="empty">
            Could not load supervisors.
          </td>
        </tr>`;

      console.error(error);

      return;
    }


    if (!data || data.length === 0) {

      supervisorTableBody.innerHTML =
        `<tr>
          <td colspan="5" class="empty">
            No supervisors found.
          </td>
        </tr>`;

      return;
    }


    supervisorTableBody.innerHTML =
      data.map(supervisor => `

        <tr>

          <td>
            ${escapeHtml(supervisor.supervisor_code || "")}
          </td>

          <td>
            ${escapeHtml(supervisor.full_name || "")}
          </td>

          <td>
            ${escapeHtml(supervisor.mobile || "")}
          </td>

          <td>
            ${escapeHtml(supervisor.status || "")}
          </td>

          <td>

            <div class="actions">

              <button
                class="edit"
                onclick="editSupervisor(${supervisor.id})"
              >
                Edit
              </button>

              <button
                class="delete"
                onclick="deleteSupervisor(${supervisor.id}, '${escapeJs(supervisor.full_name)}')"
              >
                Delete
              </button>

            </div>

          </td>

        </tr>

      `).join("");

  }


  // ==========================================
  // ADD / EDIT SUPERVISOR
  // ==========================================

  supervisorForm.addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();


      const id =
        document.getElementById("supervisorId").value;

      const supervisorCode =
        document.getElementById("supervisorCode").value.trim();

      const fullName =
        document.getElementById("supervisorName").value.trim();

      const mobile =
        document.getElementById("supervisorMobile").value.trim();

      const status =
        document.getElementById("supervisorStatus").value;


      if (!supervisorCode || !fullName) {

        showSupervisorError(
          "Supervisor code and name are required."
        );

        return;
      }


      const payload = {

        supervisor_code: supervisorCode,

        full_name: fullName,

        mobile: mobile || null,

        status: status

      };


      const saveButton =
        document.getElementById(
          "saveSupervisorButton"
        );


      saveButton.disabled = true;

      saveButton.textContent =
        id ? "Saving..." : "Adding...";


      let result;


      if (id) {

        result =
          await db
            .from("supervisors")
            .update(payload)
            .eq("id", id);

      } else {

        result =
          await db
            .from("supervisors")
            .insert(payload);

      }


      saveButton.disabled = false;


      if (result.error) {

        showSupervisorError(
          result.error.message
        );

        saveButton.textContent =
          id
            ? "Save Changes"
            : "Add Supervisor";

        return;
      }


      showSupervisorSuccess(
        id
          ? "Supervisor updated successfully."
          : "Supervisor added successfully."
      );


      resetSupervisorForm();

      await loadSupervisors();

    }
  );


  // ==========================================
  // EDIT SUPERVISOR
  // ==========================================

  async function editSupervisor(id) {

    const {
      data,
      error
    } = await db
      .from("supervisors")
      .select(
        "id, supervisor_code, full_name, mobile, status"
      )
      .eq("id", id)
      .single();


    if (error) {

      showSupervisorError(
        error.message
      );

      return;
    }


    document.getElementById(
      "supervisorId"
    ).value = data.id;

    document.getElementById(
      "supervisorCode"
    ).value = data.supervisor_code || "";

    document.getElementById(
      "supervisorName"
    ).value = data.full_name || "";

    document.getElementById(
      "supervisorMobile"
    ).value = data.mobile || "";

    document.getElementById(
      "supervisorStatus"
    ).value = data.status || "active";


    document.getElementById(
      "saveSupervisorButton"
    ).textContent =
      "Save Changes";


    cancelSupervisorEditButton.classList.remove(
      "hidden"
    );


    window.scrollTo({
      top: supervisorSection.offsetTop,
      behavior: "smooth"
    });

  }


  // ==========================================
  // DELETE SUPERVISOR
  // ==========================================

  async function deleteSupervisor(
    id,
    supervisorName
  ) {

    const confirmed =
      confirm(
        `Delete ${supervisorName}?\n\nThis action cannot be undone.`
      );


    if (!confirmed) {
      return;
    }


    const {
      error
    } = await db
      .from("supervisors")
      .delete()
      .eq("id", id);


    if (error) {

      showSupervisorError(
        error.message
      );

      return;
    }


    showSupervisorSuccess(
      "Supervisor deleted successfully."
    );


    await loadSupervisors();

  }


  // ==========================================
  // CANCEL SUPERVISOR EDIT
  // ==========================================

  cancelSupervisorEditButton.addEventListener(
    "click",
    () => {

      resetSupervisorForm();

    }
  );


  // ==========================================
  // RESET SUPERVISOR FORM
  // ==========================================

  function resetSupervisorForm() {

    supervisorForm.reset();

    document.getElementById(
      "supervisorId"
    ).value = "";

    document.getElementById(
      "supervisorStatus"
    ).value = "active";

    document.getElementById(
      "saveSupervisorButton"
    ).textContent =
      "Add Supervisor";

    cancelSupervisorEditButton.classList.add(
      "hidden"
    );

  }


  // ==========================================
  // LOGOUT
  // ==========================================

  logoutButton.addEventListener(
    "click",
    async () => {

      await db.auth.signOut();

      showLogin();

    }
  );


  // ==========================================
  // AUTH STATE
  // ==========================================

  db.auth.onAuthStateChange(
    async (event, session) => {

      if (session) {

        await loadAccount();

      } else {

        showLogin();

      }

    }
  );


  // ==========================================
  // EXISTING SESSION
  // ==========================================

  async function checkExistingSession() {

    const {
      data: { session }
    } = await db.auth.getSession();


    if (session) {

      await loadAccount();

    } else {

      showLogin();

    }

  }


  // ==========================================
  // UI HELPERS
  // ==========================================

  function showLogin() {

    loginSection.classList.remove(
      "hidden"
    );

    accountSection.classList.add(
      "hidden"
    );

  }


  function showStatus(message) {

    statusMessage.innerHTML =
      `<div class="success">
        ${escapeHtml(message)}
      </div>`;

  }


  function showError(message) {

    statusMessage.innerHTML =
      `<div class="error">
        ${escapeHtml(message)}
      </div>`;

  }


  function showEmployeeSuccess(message) {

    employeeMessage.innerHTML =
      `<div class="success">
        ${escapeHtml(message)}
      </div>`;

  }


  function showEmployeeError(message) {

    employeeMessage.innerHTML =
      `<div class="error">
        ${escapeHtml(message)}
      </div>`;

  }


  function showSupervisorSuccess(message) {

    supervisorMessage.innerHTML =
      `<div class="success">
        ${escapeHtml(message)}
      </div>`;

  }


  function showSupervisorError(message) {

    supervisorMessage.innerHTML =
      `<div class="error">
        ${escapeHtml(message)}
      </div>`;

  }


  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function escapeJs(value) {

    return String(value)
      .replaceAll("\\", "\\\\")
      .replaceAll("'", "\\'")
      .replaceAll("\n", "\\n")
      .replaceAll("\r", "\\r");

  }


  // ==========================================
  // START
  // ==========================================

  checkExistingSession();

</script></body>
</html>
