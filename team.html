<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHRI — Manpower Services</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      margin: 0;
    }
    /* Navbar */
    .navbar {
      background: linear-gradient(to right, #ff512f, #f09819);
    }
    .navbar-brand img {
      height: 50px;
    }
    .navbar-nav .nav-link {
      color: white !important;
      margin: 0 10px;
      font-weight: 500;
    }
    /* Hero Section */
    .hero {
      background: url('images/event-staff.jpg') center/cover no-repeat;
      height: 85vh;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      background-color: rgba(0,0,0,0.4);
      background-blend-mode: darken;
    }
    .hero h1 {
      font-size: 3rem;
      font-weight: bold;
    }
    .hero p {
      font-size: 1.3rem;
      margin-bottom: 25px;
    }
    .hero .btn {
      padding: 12px 28px;
      font-size: 1.1rem;
      border-radius: 25px;
    }
    /* Lead Capture Section */
    .lead-form {
      background: #fff6f0;
      padding: 60px 20px;
    }
    .lead-form h2 {
      color: #ff512f;
      font-weight: bold;
      margin-bottom: 20px;
      text-align: center;
    }
    .lead-form form {
      max-width: 600px;
      margin: auto;
    }
    .form-control:focus {
      border-color: #f09819;
      box-shadow: 0 0 0 0.2rem rgba(240,152,25,0.25);
    }
    /* Footer */
    footer {
      background: linear-gradient(to right, #ff512f, #f09819);
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 40px;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">
      <img src="images/shriapp.png" alt="SHRI Logo" />
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        <li class="nav-item"><a class="nav-link" href="privacy.html">Privacy Policy</a></li>
        <li class="nav-item"><a class="nav-link" href="myaccount.html">My Account</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Hero Banner -->
<section class="hero">
  <h1>Trusted Manpower Services in Mumbai</h1>
  <p>Reliable staff for catering, hospitality, and events</p>
  <a href="https://wa.me/917738792479" target="_blank" class="btn btn-light">Hire Now</a>
</section>

<!-- Lead Capture Form -->
<section class="lead-form" id="get-quote">
  <div class="container">
    <h2>Request a Callback</h2>
    <form>
      <div class="mb-3">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
      </div>
      <div class="mb-3">
        <label for="phone" class="form-label">Phone Number</label>
        <input type="tel" class="form-control" id="phone" placeholder="Enter your phone number" required>
      </div>
      <div class="mb-3">
        <label for="service" class="form-label">Service Needed</label>
        <select id="service" class="form-select" required>
          <option selected disabled value="">Choose...</option>
          <option>Event Staffing</option>
          <option>Catering Staff</option>
          <option>Hospitality Services</option>
          <option>Other</option>
        </select>
      </div>
      <div class="d-grid">
        <button type="submit" class="btn btn-warning">Submit Request</button>
      </div>
    </form>
  </div>
</section>

<!-- Footer -->
<footer>
  <p>&copy; 2025 SHRI. All Rights Reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
